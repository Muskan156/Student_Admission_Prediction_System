            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
        }
        input{
            width: 100%;

            border-radius: 8px;

<body>
    <div class="admin-login-box">
        <h2>Admin Login</h2>
        <form method="POST" action="{{ url_for('admin_login') }}">
